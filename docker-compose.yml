version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vitalpulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vitalpulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: vitalpulse-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vitalpulse_db?schema=public
      JWT_SECRET: vitalpulse_super_secret_jwt_key_2026
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
      - ml-service

  ml-service:
    build: ./ml-service
    container_name: vitalpulse-ml-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: vitalpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
